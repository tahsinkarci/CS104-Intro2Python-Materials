<style>
/* Layout: graph-paper lab bench. Controls on top, code beside its graph, then console / state / notes. */
:root{
  --paper:#f4f7fb; --card:#ffffff; --grid:#e3e9f2; --grid2:#d3dce8; --ink:#17212e; --muted:#5a6779;
  --dec:#d6453a; --inc:#2c6cd4; --wall:#178a73; --hl:#fff1b8; --hlbar:#e8b400; --miss:#f6f8fb;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1828; --card:#122136; --grid:#172a44; --grid2:#24395a; --ink:#e4ecf7; --muted:#93a4bb;
  --dec:#ff7b6e; --inc:#6ea8ff; --wall:#4fd1b5; --hl:#2c3a2a; --hlbar:#e8c043; --miss:#0f1c2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1828; --card:#122136; --grid:#172a44; --grid2:#24395a; --ink:#e4ecf7; --muted:#93a4bb;
  --dec:#ff7b6e; --inc:#6ea8ff; --wall:#4fd1b5; --hl:#2c3a2a; --hlbar:#e8c043; --miss:#0f1c2f; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
*,*::before,*::after{box-sizing:border-box}
.wrap{max-width:1680px;margin:0 auto;padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:7px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--inc);outline-offset:2px}

header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
h1{font:800 24px/1 var(--display);margin:0;letter-spacing:-.02em;white-space:nowrap}
h1 .d{color:var(--dec)} h1 .i{color:var(--inc)}
:root{--claude:#d97757; --shades:#16181d}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.credit{display:flex;flex-direction:column;font-size:10.5px;line-height:1.3;color:var(--muted);border-left:1px solid var(--grid2);padding-left:12px}
.credit .who{font-weight:700;color:var(--ink);font-size:11.5px}
.credit a{color:var(--inc);text-decoration:none;user-select:all} .credit a:hover{text-decoration:underline}
.credit .by{display:flex;align-items:center;gap:4px}
.mascot{width:18px;height:15px;flex:none;image-rendering:pixelated}.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tgroup{display:flex;gap:2px;align-items:stretch;background:var(--card);border:1px solid var(--grid2);border-radius:9px;padding:3px}
.tgroup .glyph{font:800 17px/1 var(--display);padding:0 6px;display:grid;place-items:center;color:var(--muted)}
.tab{border:0;background:transparent;border-radius:6px;padding:3px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:0}
.tab b{font:600 12px var(--mono)} .tab small{font-size:10.5px;color:var(--muted)}
.tab:hover{background:var(--miss)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)} .tab[aria-selected="true"] small{color:inherit;opacity:.75}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--grid2);border-radius:10px;
  padding:5px 8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.btns{display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--grid2);background:var(--miss);display:grid;place-items:center;cursor:pointer}
.ib:hover{border-color:var(--muted)} .ib svg{width:18px;height:18px;fill:currentColor}
.ib.play{width:44px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scrub{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.track{position:relative;flex:1;min-width:0;height:30px;display:flex;align-items:center}
.track input{width:100%;margin:0;accent-color:var(--inc)}
/* Small gray tick under the bar at each iteration start. The handle is ~16px wide, so ticks run from 8px to (width - 8px). */
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{position:absolute;bottom:1px;height:6px;width:1.5px;margin-left:-.75px;background:var(--muted)}
.tb{border:1px solid var(--grid2);background:var(--miss);border-radius:7px;padding:4px 8px;font:600 12px var(--mono);cursor:pointer;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.count{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.opt select{border:1px solid var(--grid2);background:var(--miss);border-radius:7px;padding:5px 6px}
.stepper{display:flex;align-items:center;border:1px solid var(--grid2);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--miss);width:26px;height:28px;cursor:pointer;font-weight:600}
.stepper output{min-width:30px;text-align:center;font:600 15px var(--mono);color:var(--ink)}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--inc)}
.snd{border:1px solid var(--grid2);background:var(--miss);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
.snd svg{width:16px;height:16px;fill:currentColor} .snd[aria-pressed="false"]{opacity:.6}

.narr{display:flex;gap:10px;align-items:center;padding:0 2px;min-height:26px}
.narr .where{font:600 11px var(--mono);color:var(--paper);background:var(--ink);border-radius:5px;padding:2px 7px;white-space:nowrap}
.narr p{margin:0;font:600 15px/1.3 var(--display)}

/* One screen on wide displays: code | graph | console, variables, notes */
body{margin:0}
.app{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,.95fr);gap:8px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (min-width:1100px){
  html,body{height:100%}
  .wrap{height:100%}
  .app{flex:1;min-height:0}
  .app>.panel,.side{min-height:0}
  .codep .code{flex:1;min-height:0;overflow-y:auto}
  .graph #graph{flex:1;min-height:0}
  .graph #graph svg{height:100%}
  .side .notes{flex:1;min-height:0;overflow-y:auto}
}
@media (max-width:1099px){.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .side{grid-column:1/-1}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--grid2);border-radius:10px;padding:7px 10px;min-width:0;display:flex;flex-direction:column;gap:5px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph h2{margin:0;font:600 10.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ph .file{font:11px var(--mono);color:var(--muted)}
.statep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}

/* code */
.code{font:10px/1.34 var(--mono);overflow-x:hidden;margin:0 -10px -7px;padding:0 8px 6px 0;position:relative}
.ln{display:grid;grid-template-columns:28px minmax(0,1fr);white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid transparent;transition:background .2s}
.ln .no{color:var(--muted);opacity:.55;text-align:right;padding-right:9px;user-select:none}
.ln.active{background:var(--hl);border-left-color:var(--hlbar)}
.ln.active .no{opacity:1;color:var(--ink);font-weight:600}
.ln .ev{display:none;grid-column:2;font:600 10.5px var(--mono);color:var(--ink);padding:1px 0 3px;white-space:normal}
.ln.active .ev:not(:empty){display:block}
.ln .ev span{background:var(--card);border:1px solid var(--hlbar);border-radius:5px;padding:1px 7px}
.ln.run .no::after{content:"";}
.t-com{color:var(--muted);font-style:italic} .t-str{color:var(--wall)} .t-kw{color:var(--dec);font-weight:600} .t-fn{color:var(--inc)} .t-num{color:var(--hlbar)}

/* graph */
.graph svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
.c-dec{background:var(--dec)} .c-inc{background:var(--inc)} .c-wall{background:var(--wall)}
svg text{font-family:var(--mono)}
.code,.con,.notes code,.ln .ev,.vars{font-variant-ligatures:none}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--muted);stroke-width:1.2}
.tl{fill:var(--muted);font-size:11px}
.al{fill:var(--muted);font:600 11px var(--body);letter-spacing:.06em}
.band{fill:var(--hl)}
.s-dec{stroke:var(--dec)} .s-inc{stroke:var(--inc)} .s-wall{stroke:var(--wall)}
.f-dec{fill:var(--dec)} .f-inc{fill:var(--inc)} .f-wall{fill:var(--wall)} .f-ink{fill:var(--ink)} .f-mut{fill:var(--muted)}
.ext{stroke-width:1.5;stroke-dasharray:2 6;opacity:.5;fill:none}
.dom{stroke-width:2;stroke-dasharray:7 5;opacity:.55;fill:none}
.trace{stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pt{stroke:var(--card);stroke-width:2}
.new{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out infinite}
.halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.flab{font-size:12px;font-weight:600}
.mid{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1.2}
.cell{stroke:var(--grid2);stroke-width:1;fill:var(--card)}
.k-miss{fill:var(--miss)}
.k-hit{fill:color-mix(in srgb,var(--inc) 24%,var(--card))}
.k-border{fill:color-mix(in srgb,var(--ink) 9%,var(--card))}
.k-wall{fill:color-mix(in srgb,var(--wall) 24%,var(--card))}
.k-diag{fill:color-mix(in srgb,var(--inc) 24%,var(--card))}
.cur{fill:none;stroke:var(--hlbar);stroke-width:3}
.cch{font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}

/* console */
.con{margin:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:7px 10px;font:13px/1.3 var(--mono);
  min-height:120px;max-height:200px;overflow:auto;white-space:pre}
.con .in{color:color-mix(in srgb,var(--paper) 55%,var(--ink))}
.con .star{color:var(--hlbar);font-weight:600}
.con .dash{color:var(--inc);font-weight:600}
.con .sp{color:color-mix(in srgb,var(--paper) 35%,var(--ink))}
.con .sp.dec{background:color-mix(in srgb,var(--dec) 38%,var(--ink));color:color-mix(in srgb,var(--paper) 70%,var(--dec))}
.con .sp.inc{background:color-mix(in srgb,var(--inc) 38%,var(--ink));color:color-mix(in srgb,var(--paper) 70%,var(--inc))}
.con .fresh{animation:flash .6s}
@keyframes flash{0%{outline:2px solid var(--hlbar)}100%{outline:2px solid transparent}}
.caret{display:inline-block;width:.6em;height:1.1em;vertical-align:-.15em;background:var(--hlbar);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* state */
.vars{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0;font:12px var(--mono)}
.vars dt{color:var(--muted)} .vars dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.vars dd.chg{animation:flash .6s}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{min-width:38px;border-radius:6px;padding:2px 4px;font:10px/1.2 var(--mono);text-align:center;border:1px solid var(--grid2);color:var(--muted);background:var(--miss)}
.chip b{display:block;font-size:11px;color:var(--ink)}
.chip.done.dec{background:color-mix(in srgb,var(--dec) 16%,var(--card));border-color:var(--dec)}
.chip.done.inc{background:color-mix(in srgb,var(--inc) 16%,var(--card));border-color:var(--inc)}
.chip.done.both{background:linear-gradient(90deg,color-mix(in srgb,var(--inc) 18%,var(--card)) 50%,color-mix(in srgb,var(--dec) 18%,var(--card)) 50%);border-color:var(--muted)}
.chip.done.grid{background:color-mix(in srgb,var(--wall) 14%,var(--card));border-color:var(--wall)}
.chip.now{outline:2px solid var(--hlbar);outline-offset:1px;color:var(--ink)}
.small{font-size:12px;color:var(--muted);margin:0}

/* notes */
.notes .lead{margin:0;font-size:12.5px;line-height:1.45}
.notes blockquote{margin:0;border-left:3px solid var(--hlbar);padding:2px 0 2px 9px;font:11px/1.45 var(--mono);color:var(--muted)}
.notes h3{margin:2px 0 0;font:600 10.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.notes ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;line-height:1.4}
.notes code{font:11px var(--mono);background:var(--miss);border:1px solid var(--grid2);border-radius:4px;padding:0 4px}
.shape{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.shape pre{margin:0;font:12px/1.2 var(--mono);background:var(--miss);border:1px solid var(--grid2);border-radius:6px;padding:5px 9px}
.f{font:11.5px var(--mono);display:inline-block;padding:1px 6px;border-radius:5px}
.f.dec{color:var(--dec);background:color-mix(in srgb,var(--dec) 10%,var(--card))}
.f.inc{color:var(--inc);background:color-mix(in srgb,var(--inc) 10%,var(--card))}
.f.wall{color:var(--wall);background:color-mix(in srgb,var(--wall) 10%,var(--card))}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font:11px var(--mono);border:1px solid var(--grid2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
@media (prefers-reduced-motion: reduce){.new,.ring,.con .fresh,.vars dd.chg,.caret{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 title="The number of spaces in each row follows a line that goes down, up, or stays flat.">K and N <span class="d">Gap</span> <span class="i">Graphs</span></h1>
      <div class="credit">
        <span>by <b class="who">Tahsin Karcı</b> · For any inconvenience or suggestion: <a href="mailto:tahsin.karci@ozu.edu.tr">tahsin.karci@ozu.edu.tr</a></span>
        <span class="by">Animated by Claude <svg class="mascot" viewBox="0 0 12 10" shape-rendering="crispEdges" aria-hidden="true"><g fill="var(--claude)"><rect x="2" y="1" width="8" height="6"/><rect x="0" y="3" width="2" height="2"/><rect x="10" y="3" width="2" height="2"/><rect x="2" y="7" width="1" height="2"/><rect x="4" y="7" width="1" height="2"/><rect x="7" y="7" width="1" height="2"/><rect x="9" y="7" width="1" height="2"/></g><g fill="var(--shades)"><rect x="4" y="2" width="1" height="2"/><rect x="7" y="2" width="1" height="2"/></g></svg></span>

<script>
// ---------- Source files (exact text from the review folder) ----------
const SRC = {
k1:`# *   *
# *  *
# * *
# *  *
# *   *


k = int(input("K=?:"))
#If the question asks, you can implement an if-else here to check the input consistency.

#We can decide how the gap changes according to the increase in the rows.

#Think of it like F(x): as x increases, the number of gaps should decrease until the middle.
#Like a function y = b - m * x, where m is positive.

#After the middle, it should increase.
#Like a function y = m * x + b.
for i in range(k):
    if i < k // 2: #until the middle
        print("*", end="")
        print(" " * (k - 2 - i), end="") #If the question asks for a nested loop, change this line to a loop.
        print("*")
    else: #after the middle
        print("*", end="")
        print(" " * (i-1), end="")
        print("*")

#However, for larger K values, the middle joint starts to separate. Why?
#Because we did not fix the number of gaps to 1 in the middle.
#It should be fixed to 1 at the middle point k//2.
#We should start from (k//2 + 1) and decrease 1 by 1, k//2 times, until the middle.
#Please check the version 2 code.
#Run both with different K values.`,
k2:`# *   *
# *  *
# * *
# *  *
# *   *

k = int(input("K=?:"))

for i in range(k):
    if i < k // 2:
        print("*", end="")
        print(" " * (k//2 + 1 - i), end="")
        print("*")
    else:
        print("*", end="")
        print(" " * (i - k//2 + 1), end="")
        print("*")`,
n1:`# **    *
# * *   *
# *  *  *
# *   * *
# *    **

n = int(input("N=?:"))

// Match each short line to its line number in the real file.
function mapLines(full, short){
  const F = full.split('\n'), S = short.split('\n');
  const key = l => l.replace(/#.*$/, '').trim() || l.trim();
  const label = [], toShort = {}; let p = 0;
  S.forEach((sl, si) => {
    const k = key(sl); if (!k){ label.push(''); return; }
    for (let q = p; q < F.length; q++){ if (key(F[q]) === k){ label.push(q+1); toShort[q+1] = si+1; p = q+1; return; } }
    label.push('');
  });
  return { label, toShort };
}

const o = (t, c) => ({ t, c });
const sp = n => ' '.repeat(Math.max(0, n));
const listJoin = a => a.join(', ');

// ---------- Step builders: each returns the full list of steps for size n ----------
function bK1(k){
  const h = Math.floor(k/2), S = [], gaps = [];
  S.push({line:8, ev:`k = ${k}`, vars:{k, 'k//2':h}, out:[o(`K=?:${k}\n`,'in')], note:`Read the size: k = ${k}. The gap switches direction at row k // 2 = ${h}.`, snd:['input']});
  for (let i=0;i<k;i++){
    S.push({line:18, ev:`i = ${i}`, vars:{i, gap:undefined}, row:i, note:`Row ${i}: iteration ${i+1} of ${k}.`, snd:['loop']});
    const c = i < h, g = c ? k-2-i : i-1; gaps.push(g);
    S.push({line:19, ev:`${i} < ${h}  →  ${c?'True':'False'}`, branch:c?'dec':'inc',
      note: c ? `${i} is before the middle, so the gap follows the decreasing line.` : `${i} has reached the middle, so the gap follows the increasing line.`, snd:[c?'condT':'condF']});
    const L = c ? [20,21,22] : [24,25,26];
    S.push({line:L[0], ev:`print("*", end="")`, out:[o('*','star')], snd:['star']});
    S.push({line:L[1], ev: c ? `" " * (k - 2 - i)  =  " " * (${k} - 2 - ${i})  =  ${g} spaces` : `" " * (i - 1)  =  " " * (${i} - 1)  =  ${g} spaces`,
      vars:{gap:g}, out:[o(sp(g),'sp '+(c?'dec':'inc'))], plot:{s:c?'dec':'inc', x:i, y:g},
      note:`Print ${g} space${g===1?'':'s'} and plot (${i}, ${g}) on ${c?'y = (k − 2) − i':'y = i − 1'}.`, snd:['plot', g, c?'dec':'inc']});
    S.push({line:L[2], ev:`print("*")  →  new line`, out:[o('*','star'), o('\n')], rowDone:i, snd:['newline']});
  }
  const minGap = Math.min(...gaps);
  S.push({line:null, done:true, note:`Done. Gaps: ${listJoin(gaps)}. The middle gap is ${minGap}${minGap>1?`, not 1, so the joint separates. It grows with k (k//2 − 1). letterKv2.py fixes it at 1.`:minGap===1?'. At this size the joint looks right. Try k = 7 or 9 to see it separate.':', so the middle row has no gap.'}`, snd:['done']});
  return S;
}
function bK2(k){

      note: c ? `Above the middle: count down from k//2 + 1.` : `Middle or below: count up from 1.`, snd:[c?'condT':'condF']});
    const L = c ? [11,12,13] : [15,16,17];

      if (hit) S.push({line:16, ev:`print("-", end="")`, out:[o('-','dash')], cell:{i,j,kind:'hit',ch:'-'}, snd:['hit', j], dur:1});

    }

function bN3(n){
  const S = [];
  S.push({line:8, ev:`n = ${n}`, vars:{n}, out:[o(`Enter an odd integer${n}\n`,'in')], note:`Read n = ${n}. Every cell of an ${n} × ${n} grid gets tested against three rules.`, snd:['input']});
  S.push({line:10, ev:`${n} < 3  →  False`,
    note:`n = ${n} is at least 3, so the check passes and the grid is drawn.`, snd:['condF']});
  for (let i=0;i<n;i++){
    S.push({line:14, ev:`i = ${i}`, vars:{i, j:undefined, rule:undefined}, row:i, branch:'grid', cursor:null, note:`Row ${i} of ${n}.`, snd:['loop']});
    S.push({line:15, ev:`j = 0, 1, … ${n-1}`, snd:['loop'], dur:.6});
    for (let j=0;j<n;j++){
      let kind, ev, note, rule;
      if (j===0){ kind='wall'; ev=`j == 0  →  True  (stops checking)`; note=`j = 0: left wall.`; rule='left wall'; }
      else if (j===n-1){ kind='wall'; ev=`j == 0 False · j == n-1  →  ${j} == ${n-1}  True`; note=`j = ${j} = n − 1: right wall.`; rule='right wall'; }
      else if (i===j){ kind='diag'; ev=`j == 0 False · j == n-1 False · i == j  →  ${i} == ${j}  True`; note=`i = j = ${j}: on the diagonal.`; rule='diagonal'; }
      else { kind='miss'; ev=`all three rules False`; note=`(${i}, ${j}) matches no rule: print a space.`; rule='none'; }
      const hit = kind!=='miss';
      S.push({line:16, ev, vars:{j, rule}, cursor:{i,j}, note, dur:hit?1:.5, snd:[hit?'condT':'tick']});
      if (hit) S.push({line:17, ev:`print("*", end="")`, out:[o('*','star')], cell:{i,j,kind,ch:'*'}, snd:['hit', j, kind], dur:.9});
      else S.push({line:19, ev:`print(" ", end="")`, out:[o(' ','sp')], cell:{i,j,kind:'miss',ch:''}, snd:['space'], dur:.45});
    }
    S.push({line:20, ev:`print()  →  new line`, out:[o('\n')], cursor:null, rowDone:i, snd:['newline']});
  }
  S.push({line:null, done:true, note:`Done. Two constant lines (the walls) plus one increasing line (the diagonal) make the N.`, snd:['done']});
  return S;
}

// ---------- Helpers ----------
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const KW = new Set(['for','in','if','else','and','or','not']), BI = new Set(['print','range','int','input']);
function hlPy(line){
  const re = /(#.*$)|("(?:[^"\\]|\\.)*")|([A-Za-z_]\w*)|(\d+)/g; let out='', last=0, m;
  while ((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    if (m[1]) out += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) out += KW.has(m[3]) ? `<span class="t-kw">${m[3]}</span>` : BI.has(m[3]) ? `<span class="t-fn">${m[3]}</span>` : m[3];
    else out += `<span class="t-num">${m[4]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}

let AC = null, master = null, soundOn = store.get('sound', true);
function audio(){
  if (!soundOn) return null;
  try {
    if (!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .32; master.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ return null; }
  return AC;
}
function tone(freq, dur=.12, type='triangle', vol=.4, when=0, glide){
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  if (glide) osc.frequency.exponentialRampToValueAtTime(glide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  osc.connect(g).connect(master); osc.start(t); osc.stop(t + dur + .03);
}
let noiseBuf = null;
function click(vol=.15, when=0, freq=3200, dur=.025){
  const a = audio(); if (!a) return;
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate*.1, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
  const t = a.currentTime + when, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + .02);
}
const PENT = [0,2,4,7,9,12,14,16,19,21,24,26];
const pitch = v => 261.63 * Math.pow(2, PENT[Math.max(0, Math.min(PENT.length-1, v))]/12);
function sfx(step){
  if (!soundOn || !step || !step.snd) return;
  const [name, a, b] = step.snd;
  switch (name){
    case 'input':   tone(523,.14,'sine',.35); tone(784,.22,'sine',.35,.12); break;
    case 'loop':    click(.12,0,1800,.03); break;
    case 'condT':   tone(660,.09,'square',.07,0,990); break;
    case 'condF':   tone(520,.1,'square',.06,0,350); break;
    case 'tick':    click(.05,0,4200,.015); break;
    case 'space':   click(.06,0,2600,.02); break;
    case 'star':    click(.22,0,5200,.02); tone(1760,.04,'square',.04); break;
    case 'plot':    // one tap per printed space, then a note whose pitch is the gap
      for (let s=0;s<Math.min(a,10);s++) click(.07, s*.032, 2600, .02);
      tone(pitch(a), .32, b==='dec'?'triangle':'sine', .42, Math.min(a,10)*.032);
      break;
    case 'hit':     tone(pitch(a+2), .28, b==='wall'?'triangle':'sine', .4); click(.18,0,5200,.02); break;
    case 'newline': click(.25,0,900,.05); tone(1568,.35,'sine',.12,.04); break;
    case 'buzz':    tone(140,.3,'sawtooth',.12); break;
    case 'done':    [523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.3,i*.09)); break;
  }
}

// ---------- State ----------
let P = Math.min(4, Math.max(0, store.get('prog', 0)));
let N = Math.min(9, Math.max(3, store.get('n', 5)));
let speed = 1, playing = false, timer = null, cur = 0, steps = [];
let showSpaces = true, autoNext = true;
const $ = id => document.getElementById(id);
let lineEls = [];

function computeState(upto){
  const s = { out:[], vars:{}, plots:{}, cells:{}, cursor:null, row:-1, rowsDone:new Set(), branches:{}, note:'', changed:new Set(), fresh:0 };
  for (let x=0; x<=upto; x++){
    const p = steps[x];
    if (x === upto){ s.fresh = s.out.length; if (p.vars) Object.keys(p.vars).forEach(k=>s.changed.add(k)); }
    if (p.vars) Object.assign(s.vars, p.vars);
    if (p.out) s.out.push(...p.out);
    if (p.plot) (s.plots[p.plot.s] = s.plots[p.plot.s] || []).push(p.plot);
    if (p.cell) s.cells[p.cell.i+','+p.cell.j] = p.cell;
    if ('cursor' in p) s.cursor = p.cursor;
    if (p.row != null) s.row = p.row;
    if (p.branch) s.branches[s.row] = p.branch;
    if (p.rowDone != null) s.rowsDone.add(p.rowDone);
    if (p.note) s.note = p.note;
  }
  s.step = steps[upto];
  return s;
}

// ---------- Rendering ----------
function buildTabs(){
  const groups = {K:[], N:[]};
  PROGS.forEach((p,i)=>groups[p.letter].push(`<button class="tab" role="tab" id="tab-${p.id}" data-i="${i}" aria-selected="${i===P}"><b>${p.file}</b><small>${p.tag}</small></button>`));
  $('tabs').innerHTML = Object.entries(groups).map(([L,b])=>`<div class="tgroup"><span class="glyph" aria-hidden="true">${L}</span>${b.join('')}</div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ const wasPlaying = playing; stop(); loadProgram(+b.dataset.i, wasPlaying ? 'start' : 'end'); if (wasPlaying) play(); }));
}
function buildCode(){
  const prog = PROGS[P], short = SHORT[prog.id];
  prog.map = mapLines(prog.src, short);
  $('code').innerHTML = short.split('\n').map((l,i)=>`<div class="ln"><span class="no">${prog.map.label[i]}</span><span>${hlPy(l)||' '}</span><span class="ev"></span></div>`).join('');
  lineEls = [...$('code').querySelectorAll('.ln')];
  $('codeFile').textContent = 'review/' + prog.file;
  $('notes').innerHTML = prog.notes(N);
}
function render(){
  const prog = PROGS[P], s = computeState(cur), st = s.step;
  // code
  lineEls.forEach(el=>{ el.classList.remove('active'); el.querySelector('.ev').innerHTML=''; });
  const shown = st.line && prog.map.toShort[st.line];
  if (shown){
    const el = lineEls[shown-1]; el.classList.add('active');
    if (st.ev) el.querySelector('.ev').innerHTML = `<span>${esc(st.ev)}</span>`;
    const box = $('code'), top = el.offsetTop - box.offsetTop;
    if (top < box.scrollTop + 20 || top > box.scrollTop + box.clientHeight - 60) box.scrollTop = top - box.clientHeight/2;
  }
  $('where').textContent = st.done ? 'finished' : st.line ? `line ${st.line}` : 'start';
  $('note').textContent = s.note;
  // graph
  $('graph').innerHTML = prog.kind === 'line' ? lineGraph(prog, s) : gridGraph(prog, s);
  const G = prog.graph(N);
  $('legend').innerHTML = G.legend.map(([c,t])=>`<span><i class="c-${c}"></i>${t}</span>`).join('');
  $('graphTitle').textContent = prog.kind === 'line' ? 'Gap graph' : 'Grid graph';
  $('graphSub').textContent = prog.kind === 'line' ? 'x = row i · y = number of spaces' : 'x = column j · y = row i';
  // console
  let h = '';
  s.out.forEach((p,idx)=>{
    let t = p.t; const isSp = p.c && p.c.startsWith('sp');
    if (isSp && showSpaces) t = t.replace(/ /g,'·');
    const cls = [p.c, idx >= s.fresh ? 'fresh' : ''].filter(Boolean).join(' ');
    h += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
  });
  $('con').innerHTML = h + (st.done ? '' : '<span class="caret"></span>');
  $('con').scrollTop = $('con').scrollHeight;
  // vars
  $('vars').innerHTML = prog.vars.map(k=>{ const v = s.vars[k]; return `<dt>${esc(k)}</dt><dd class="${s.changed.has(k)&&v!==undefined?'chg':''}">${v===undefined?'—':esc(v)}</dd>`; }).join('');
  // chips
  let chips = '';
  for (let i=0;i<N;i++){
    const br = s.branches[i] || prog.chip, done = s.rowsDone.has(i), now = s.row===i && !done && !st.done;
    let sub = '';
    if (prog.kind==='line' && done){
      if (prog.chip==='both'){ sub = `${i} | ${N-1-i}`; } else { const pl = [...(s.plots.dec||[]),...(s.plots.inc||[])].find(p=>p.x===i); sub = pl ? `gap ${pl.y}` : ''; }
    } else if (done) sub = prog.id==='n2' ? `- at ${i}` : 'done';
    chips += `<div class="chip ${br} ${done?'done':''} ${now?'now':''}"><b>i=${i}</b>${sub||'&nbsp;'}</div>`;
  }
  $('chips').innerHTML = chips;
  // bar
  $('scrub').max = steps.length-1; $('scrub').value = cur;
  $('count').textContent = `i = ${s.row>=0 && !st.done ? s.row : '–'} · ${cur+1} / ${steps.length}`;}

function lineGraph(prog, s){
  const k = N, G = prog.graph(k), W = 560, H = 340, m = {l:44, r:20, t:30, b:46};
  const pw = W-m.l-m.r, ph = H-m.t-m.b, top = G.yMax + .7;
  const X = i => m.l + (i+.5)/k*pw, Y = v => m.t + ph - (v/top)*ph;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gap per row for ${prog.file}"><defs><clipPath id="clip"><rect x="${m.l}" y="${m.t-6}" width="${pw}" height="${ph+6}"/></clipPath></defs>`;
  if (s.row >= 0 && !s.step.done) g += `<rect class="band" x="${X(s.row)-pw/k/2}" y="${m.t}" width="${pw/k}" height="${ph}"/>`;
  for (let v=0; v<=G.yMax; v++) g += `<line class="gl" x1="${m.l}" x2="${m.l+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tl" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  for (let i=0; i<k; i++) g += `<line class="gl" x1="${X(i)}" x2="${X(i)}" y1="${m.t}" y2="${m.t+ph}"/><text class="tl" x="${X(i)}" y="${m.t+ph+16}" text-anchor="middle">${i}</text>`;
  g += `<line class="ax" x1="${m.l}" x2="${m.l+pw}" y1="${m.t+ph}" y2="${m.t+ph}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t+ph}"/>`;
  g += `<text class="al" x="${m.l+pw}" y="${H-6}" text-anchor="end">ROW i →</text><text class="al" x="${m.l}" y="${m.t-12}" >SPACES ↑</text>`;
  if (G.mid != null){
    const xm = X(G.mid-.5);
    g += `<line class="mid" x1="${xm}" x2="${xm}" y1="${m.t}" y2="${m.t+ph}"/><text class="tl halo" x="${xm}" y="${m.t-12}" text-anchor="middle">switch: k//2 = ${G.mid}</text>`;
  }
  (G.refs||[]).forEach(r=>{ g += `<line class="s-wall" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" x1="${m.l}" x2="${m.l+pw}" y1="${Y(r.y)}" y2="${Y(r.y)}"/><text class="f-wall flab halo" x="${m.l+pw/2}" y="${Y(r.y)-7}" text-anchor="middle">${r.label}</text>`; });
  G.series.forEach(se=>{
    g += `<line class="ext s-${se.id}" clip-path="url(#clip)" x1="${X(-.5)}" y1="${Y(se.f(-.5))}" x2="${X(k-.5)}" y2="${Y(se.f(k-.5))}"/>`;
    if (se.to >= se.from) g += `<line class="dom s-${se.id}" x1="${X(se.from)}" y1="${Y(se.f(se.from))}" x2="${X(se.to)}" y2="${Y(se.f(se.to))}"/>`;
    const lx = se.at==='from' ? se.from : se.to;
    if (se.to >= se.from) g += `<text class="flab f-${se.id} halo" x="${X(lx)+(se.anchor==='start'?12:-12)}" y="${Y(se.f(lx))+(se.below?20:-12)}" text-anchor="${se.anchor}">${se.label}</text>`;
  });
  G.series.forEach(se=>{
    const pts = s.plots[se.id] || [];
    if (pts.length > 1) g += `<polyline class="trace s-${se.id}" points="${pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ')}"/>`;
    pts.forEach(p=>{
      const isNew = s.step.plot && s.step.plot.s===se.id && s.step.plot.x===p.x;
      if (isNew) g += `<circle class="ring s-${se.id}" cx="${X(p.x)}" cy="${Y(p.y)}" r="7"/>`;
      g += `<circle class="pt f-${se.id} ${isNew?'new':''}" cx="${X(p.x)}" cy="${Y(p.y)}" r="${isNew?7:5.5}"/>`;
      if (isNew) g += `<text class="flab f-ink halo" x="${X(p.x)}" y="${Y(p.y)+(p.y > G.yMax-1 ? 24 : -14)}" text-anchor="middle">(${p.x}, ${p.y})</text>`;
    });
  });
  return g + '</svg>';
}

function gridGraph(prog, s){
  const n = N, G = prog.graph(n), cols = G.cols;
  const cs = Math.max(30, Math.min(48, Math.floor(470/cols.length))), ml = 40, mt = 40;
  const W = ml + cols.length*cs + 70, H = mt + n*cs + 26;
  const cx = j => ml + cols.indexOf(j)*cs, ry = i => mt + i*cs;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grid of cells for ${prog.file}">`;
  g += `<text class="al" x="${ml}" y="13">COLUMN j →</text><text class="al" x="4" y="${mt-8}">i ↓</text>`;
  cols.forEach(j=>{ g += `<text class="tl" x="${cx(j)+cs/2}" y="${mt-8}" text-anchor="middle">${j<0||j>=n&&prog.id==='n2' ? '*' : j}</text>`; });
  for (let i=0;i<n;i++){
    const active = s.row===i && !s.step.done;
    if (active) g += `<rect class="band" x="${ml-4}" y="${ry(i)}" width="${cols.length*cs+8}" height="${cs}"/>`;
    g += `<text class="tl" x="${ml-10}" y="${ry(i)+cs/2+4}" text-anchor="end">${i}</text>`;
    cols.forEach(j=>{
      const c = s.cells[i+','+j], kind = c ? c.kind : 'empty';
      const isNew = s.step.cell && s.step.cell.i===i && s.step.cell.j===j;
      g += `<rect class="cell k-${kind} ${isNew&&kind!=='miss'?'new':''}" x="${cx(j)+1.5}" y="${ry(i)+1.5}" width="${cs-3}" height="${cs-3}" rx="4"/>`;
      if (c && c.ch) g += `<text class="cch ${kind==='hit'||kind==='diag'?'f-inc':kind==='wall'?'f-wall':'f-ink'}" x="${cx(j)+cs/2}" y="${ry(i)+cs/2+1}">${esc(c.ch)}</text>`;
    });
  }
  const c0 = j => cx(j)+cs/2, r0 = i => ry(i)+cs/2;
  G.lines.forEach(L=>{
    if (L.t==='diag'){
      g += `<line class="s-inc" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" opacity=".75" x1="${c0(0)-cs*.35}" y1="${r0(0)-cs*.35}" x2="${c0(n-1)+cs*.35}" y2="${r0(n-1)+cs*.35}"/>`;
      g += `<text class="flab f-inc halo" x="${c0(n-1)+cs*.45}" y="${r0(n-1)+cs*.55}">${prog.id==='n3'?'i = j':'j = i'}</text>`;
    } else {
      g += `<line class="s-wall" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" opacity=".75" x1="${c0(L.j)}" y1="${mt-2}" x2="${c0(L.j)}" y2="${ry(n-1)+cs+4}"/>`;
      g += `<text class="flab f-wall halo" x="${c0(L.j)}" y="${H-4}" text-anchor="middle">${L.label}</text>`;
    }
  });
  if (s.cursor){ g += `<rect class="cur" x="${cx(s.cursor.j)}" y="${ry(s.cursor.i)}" width="${cs}" height="${cs}" rx="6"/>`; }
  return g + '</svg>';
}

// ---------- Playback ----------
function loadProgram(i, at='end'){
  P = i; store.set('prog', P);
  steps = PROGS[P].build(N);
  cur = at==='end' ? steps.length-1 : 0;
  const lastStep = Math.max(1, steps.length-1);
  $('ticks').innerHTML = iterStarts().map(i=>`<i style="left:calc(8px + (100% - 16px) * ${i/lastStep})"></i>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(+b.dataset.i===P)));
  buildCode(); render();
  if (at==='end') $('note').textContent = `${PROGS[P].file} at size ${N}. Press Play to watch it build step by step.`;
}
const delay = st => 720/speed * ((st && st.dur) || 1);
function setPlayIcon(){
  $('playIcon').innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function stop(){ playing = false; clearTimeout(timer); setPlayIcon(); }
function play(){
  audio();
  if (cur >= steps.length-1){ cur = 0; render(); sfx(steps[0]); }
  playing = true; setPlayIcon();
  timer = setTimeout(tick, delay(steps[cur]));
}
function tick(){
  if (!playing) return;
  if (cur >= steps.length-1){
    if (autoNext && P < PROGS.length-1){
      timer = setTimeout(()=>{ if (!playing) return; loadProgram(P+1,'start'); sfx(steps[0]); timer = setTimeout(tick, delay(steps[0])*1.6); }, 1800);
    } else stop();
    return;
  }
  cur++; render(); sfx(steps[cur]);
  timer = setTimeout(tick, delay(steps[cur]));
}
// Steps where a new loop iteration (new row i) begins.
const iterStarts = () => steps.map((s,i)=>s.row!=null ? i : -1).filter(i=>i>=0);
function jumpIter(d){
  stop(); audio();
  const starts = iterStarts(); let t;
  if (d > 0){ t = starts.find(i=>i>cur); if (t == null) t = steps.length-1; }
  else { const before = starts.filter(i=>i<cur); t = before.length ? before[before.length-1] : 0; }
  if (t !== cur){ cur = t; render(); sfx(steps[cur]); }
}
function go(d){ stop(); audio(); const nx = Math.max(0, Math.min(steps.length-1, cur+d)); if (nx!==cur){ cur = nx; render(); if (d>0) sfx(steps[cur]); } }
function setN(v){
  v = Math.max(3, Math.min(9, v)); if (v===N) return; N = v; store.set('n', N); $('nOut').textContent = N;
  const wasPlaying = playing; stop(); loadProgram(P, wasPlaying ? 'start' : 'end'); if (wasPlaying) play();
}

$('play').addEventListener('click', ()=> playing ? stop() : play());
$('back').addEventListener('click', ()=>go(-1));
$('prevIt').addEventListener('click', ()=>jumpIter(-1));
$('nextIt').addEventListener('click', ()=>jumpIter(1));
$('fwd').addEventListener('click', ()=>go(1));
$('restart').addEventListener('click', ()=>{ stop(); cur = 0; render(); audio(); sfx(steps[0]); });
$('scrub').addEventListener('input', e=>{ stop(); cur = +e.target.value; render(); });
$('speed').addEventListener('change', e=>{ speed = +e.target.value; });
$('nMinus').addEventListener('click', ()=>setN(N-1));
$('nPlus').addEventListener('click', ()=>setN(N+1));
$('autoNext').addEventListener('change', e=>{ autoNext = e.target.checked; });
$('showSp').addEventListener('change', e=>{ showSpaces = e.target.checked; render(); });
function setSoundBtn(){ $('sound').setAttribute('aria-pressed', String(soundOn)); $('sound').querySelector('span').textContent = soundOn ? 'Sound on' : 'Sound off'; }
$('sound').addEventListener('click', ()=>{ soundOn = !soundOn; store.set('sound', soundOn); setSoundBtn(); if (soundOn) tone(784,.12,'sine',.3); });
document.addEventListener('keydown', e=>{
  if (e.target.closest('input,select,textarea')) return;
  if (e.key===' '){ e.preventDefault(); playing ? stop() : play(); }
  else if (e.key==='ArrowRight'){ e.preventDefault(); e.shiftKey ? jumpIter(1) : go(1); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); e.shiftKey ? jumpIter(-1) : go(-1); }
  else if (e.key==='r' || e.key==='R'){ stop(); cur = 0; render(); }
});

$('nOut').textContent = N; setSoundBtn(); buildTabs(); loadProgram(P,'end');
</script>
